<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>送信完了｜LUMINOVE</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-deep:#2d4a3e; --green-mid:#4a7c67; --green-pale:#d4ede4;
      --green-mist:#f0f8f4; --cream:#faf8f3; --text-dark:#1a2a23; --text-mid:#4a5c54;
      --font-serif:'Cormorant Garamond','Hiragino Mincho ProN',serif;
      --font-sans:'Noto Sans JP',sans-serif;
      --radius:12px; --shadow:0 8px 40px rgba(45,74,62,.10);
    }
    body { font-family:var(--font-sans); color:var(--text-dark); background:var(--cream); line-height:1.8; }
    a { color:inherit; text-decoration:none; }
    header { padding:1.2rem 5%; background:rgba(250,248,243,.95); box-shadow:0 1px 12px rgba(45,74,62,.06); }
    .logo { font-family:var(--font-serif); font-size:1.6rem; font-weight:500; letter-spacing:.2em; color:var(--green-deep); }
    .logo span { color:var(--green-mid); }
    main { max-width:560px; margin:0 auto; padding:4rem 1.5rem 5rem; text-align:center; }
    .card { background:#fff; border-radius:var(--radius); padding:2.5rem 2rem; box-shadow:var(--shadow); }
    h1 { font-family:var(--font-serif); font-size:1.6rem; font-weight:500; color:var(--green-deep); margin-bottom:1rem; }
    p { font-size:.9rem; color:var(--text-mid); }
    .back { display:inline-block; margin-top:2rem; padding:.8rem 2.2rem; font-size:.85rem; color:#fff; background:var(--green-deep); border-radius:50px; }
  </style>
</head>
<body>
  <header><a href="/" class="logo">LUMI<span>NOVE</span></a></header>
  <main>
    <div class="card">
      <h1>送信が完了しました</h1>
      <p>ありがとうございます。内容を確認のうえ、担当より <strong>shop@luminove.online</strong> からメールでご連絡いたします。<br>2営業日を過ぎても連絡がない場合は、お手数ですが迷惑メールフォルダをご確認ください。</p>
      <a href="/" class="back">LUMINOVE トップへ</a>
    </div>
  </main>
</body>
</html>
