<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>メンバーログイン｜LUMINOVE</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-deep:#2d4a3e; --green-mid:#4a7c67; --green-light:#7db89a;
      --green-pale:#d4ede4; --green-mist:#f0f8f4; --cream:#faf8f3;
      --text-dark:#1a2a23; --text-mid:#4a5c54; --text-light:#8a9e96;
      --font-serif:'Cormorant Garamond','Hiragino Mincho ProN',serif;
      --font-sans:'Noto Sans JP',sans-serif;
      --radius:12px; --shadow:0 8px 40px rgba(45,74,62,.10);
    }
    body { font-family:var(--font-sans); color:var(--text-dark); background:var(--cream); line-height:1.8; }
    a { color:inherit; text-decoration:none; }
    header { padding:1.2rem 5%; background:rgba(250,248,243,.95); box-shadow:0 1px 12px rgba(45,74,62,.06); }
    .logo { font-family:var(--font-serif); font-size:1.6rem; font-weight:500; letter-spacing:.2em; color:var(--green-deep); }
    .logo span { color:var(--green-mid); }
    main { max-width:560px; margin:0 auto; padding:3rem 1.5rem 5rem; }
    h1 { font-family:var(--font-serif); font-size:1.7rem; font-weight:500; color:var(--green-deep); margin-bottom:.5rem; }
    .lead { font-size:.9rem; color:var(--text-mid); margin-bottom:2rem; }
    .benefit { background:var(--green-mist); border-radius:var(--radius); padding:1.3rem 1.5rem; margin-bottom:2rem; font-size:.9rem; }
    .benefit strong { color:var(--green-deep); }
    .benefit ul { list-style:none; margin-top:.5rem; }
    .benefit li { padding-left:1.2em; position:relative; }
    .benefit li::before { content:'✓'; position:absolute; left:0; color:var(--green-mid); }
    form { background:#fff; border-radius:var(--radius); padding:2rem 1.8rem; box-shadow:var(--shadow); }
    label { display:block; font-size:.85rem; font-weight:500; margin:1.2rem 0 .35rem; }
    label:first-of-type { margin-top:0; }
    .req { color:#c0604f; font-size:.75rem; margin-left:.3em; }
    input[type="text"], input[type="email"] {
      width:100%; padding:.7rem .9rem; font-size:1rem; font-family:var(--font-sans);
      border:1px solid var(--green-pale); border-radius:8px; background:var(--cream);
    }
    input:focus { outline:2px solid var(--green-light); }
    .hint { font-size:.75rem; color:var(--text-light); margin-top:.25rem; }
    .error { display:none; color:#c0604f; font-size:.8rem; margin-top:.4rem; }
    button {
      display:block; width:100%; margin-top:1.8rem; padding:.95rem; font-size:.95rem; font-weight:500;
      font-family:var(--font-sans); letter-spacing:.1em; color:#fff; background:var(--green-deep);
      border:none; border-radius:50px; cursor:pointer; transition:background .3s;
    }
    button:hover { background:var(--green-mid); }
    .note { font-size:.75rem; color:var(--text-light); margin-top:1.5rem; }
    .back { display:inline-block; margin-top:2.5rem; font-size:.85rem; color:var(--green-mid); }
  </style>
</head>
<body>
  <header><a href="/" class="logo">LUMI<span>NOVE</span></a></header>
  <main>
    <h1>メンバーログイン</h1>
    <p class="lead">LUMINOVEメンバー様専用のページです。ログインには、お配りしているログインコードが必要です。</p>

    <div class="benefit">
      <strong>メンバー特典</strong>
      <p>メンバー様には特別なご案内をご用意しています。詳しくは、ログイン後のご注文ページにてご確認ください。</p>
    </div>

    <form id="loginForm">
      <label>ログインコード<span class="req">必須</span></label>
      <input type="text" id="inviteCode" autocomplete="off" />
      <p class="hint">お配りしているログインコードをご入力ください。</p>
      <p class="error" id="codeError">ログインコードが正しくありません。</p>

      <button type="submit">ログイン</button>
      <p class="note">ログインすると、そのままご注文ページへ移動します。</p>
    </form>

    <a href="/" class="back">← LUMINOVE トップへ戻る</a>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      var code = document.getElementById('inviteCode').value
        .replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }) // 全角英数→半角
        .replace(/　/g, ' ') // 全角スペース→半角
        .trim()
        .toUpperCase();
      var VALID_CODES = ['LUMI10', 'SUMMER'];
      var CODE_EXPIRY = { 'SUMMER': '2026-08-31' }; // この日まで有効（期間限定コード）
      var errEl = document.getElementById('codeError');
      function today(){ var d = new Date(); return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
      if (VALID_CODES.indexOf(code) === -1) {
        errEl.textContent = 'ログインコードが正しくありません。';
        errEl.style.display = 'block';
        return;
      }
      if (CODE_EXPIRY[code] && today() > CODE_EXPIRY[code]) {
        errEl.textContent = 'このコードは有効期間が終了しました。';
        errEl.style.display = 'block';
        return;
      }
      // ログイン通過と使用コードを記録して注文ページへ（メール送信はしない）
      try {
        sessionStorage.setItem('luminove_invite_ok', '1');
        sessionStorage.setItem('luminove_code', code);
      } catch (err) {}
      location.href = '/members/order.html';
    });
  </script>
</body>
</html>
